<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Gmail Phishing Detector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 420px;
            min-height: 400px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            padding: 22px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .shield {
            width: 58px;
            height: 58px;
            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;
            font-size: 30px;

            box-shadow:
                0 6px 18px rgba(37, 99, 235, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin: 5px 0 0;
            color: #687386;
            font-size: 13px;
        }

        .info {
            background: white;
            border: 1px solid #e1e6ef;
            border-radius: 14px;
            padding: 17px;
            margin-bottom: 18px;
        }

        .info-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 7px;
        }

        .info-text {
            margin: 0;
            color: #667085;
            font-size: 13px;
            line-height: 1.5;
        }

        #checkButton {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.28);
        }

        #checkButton:hover {
            background: linear-gradient(
                135deg,
                #1d4ed8,
                #4338ca
            );
        }

        #checkButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 18px;
        }

        .loading {
            background: white;
            border: 1px solid #e1e6ef;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            color: #667085;
        }

        .privacy {
            margin-top: 22px;
            padding-top: 15px;
            border-top: 1px solid #dfe4ec;

            text-align: center;
            color: #7b8494;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <div class="shield">
                🛡
            </div>

            <div>
                <h1>Phishing Detector</h1>

                <div class="subtitle">
                    AI-powered email security
                </div>
            </div>

        </div>


        <div class="info">

            <div class="info-title">
                ✓ Ready to scan
            </div>

            <p class="info-text">
                Open an email in Gmail and click the
                button below to check it for phishing.
            </p>

        </div>


        <button id="checkButton">
            🛡️ &nbsp; Check for Phishing
        </button>


        <div id="status"></div>


        <div class="privacy">
            🔒 Email is analyzed only when you
            click the button.
        </div>

    </div>


    <script src="popup.js"></script>

</body>
</html>
